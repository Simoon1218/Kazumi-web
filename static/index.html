<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kazumi">
  <meta name="theme-color" content="#101410" id="meta-theme-color">
  <meta name="format-detection" content="telephone=no">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Kazumi</title>
  <link rel="manifest" href="/assets/manifest.json">
  <link rel="icon" type="image/png" href="/assets/icon-192.png">
  <link rel="apple-touch-icon" href="/assets/icon-180.png">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <!-- SVG Filters for real-time Anime4K-inspired Web Sharpening -->
  <svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
    <defs>
      <filter id="kazumi-sharp-fast">
        <feConvolveMatrix order="3" preserveAlpha="true" kernelMatrix="0 -0.35 0 -0.35 2.4 -0.35 0 -0.35 0"/>
      </filter>
      <filter id="kazumi-sharp-quality">
        <feConvolveMatrix order="3" preserveAlpha="true" kernelMatrix="-0.15 -0.55 -0.15 -0.55 3.8 -0.55 -0.15 -0.55 -0.15"/>
      </filter>
    </defs>
  </svg>

  <div class="layout" id="layout-root">
    <nav class="nav-rail" id="nav-rail" aria-label="主导航"></nav>
    <main class="content" id="app"></main>
  </div>

  <script src="/assets/theme.js"></script>
  <script src="/assets/store.js"></script>
  <script src="/assets/app.js"></script>
  <script src="/assets/player.js"></script>
  <script src="/assets/pages_extra.js"></script>
</body>
</html>
